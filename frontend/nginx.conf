# Only the explicit MCP entry point may be embedded by these trusted hosts.
# The ordinary website keeps its existing frame restrictions.
# $request_uri survives the SPA fallback to /index.html; $arg_mcpApp does not.
map $request_uri $portfolio_frame_ancestors {
    default "'self' https://paios.alikone.dev";
    ~[?&]mcpApp=1(?:&|$) "'self' https://paios.alikone.dev http://localhost:8000 http://127.0.0.1:8000 https://chatgpt.com https://claude.ai https://web-sandbox.oaiusercontent.com https://*.web-sandbox.oaiusercontent.com codex-sandbox://web-sandbox.oaiusercontent.com codex-sandbox://*.web-sandbox.oaiusercontent.com https://*.claudemcpcontent.com";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Security headers
    add_header Content-Security-Policy "frame-ancestors $portfolio_frame_ancestors" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # The app shell and service worker must revalidate on every visit so
    # browsers do not get stuck on stale bundles after a deployment.
    # Existing PWA workers exclude /api navigations. This native UI entry point
    # therefore reaches Nginx even when an older worker still controls the site.
    location = /api/mcp-app {
        add_header Content-Security-Policy "frame-ancestors $portfolio_frame_ancestors" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Content-Security-Policy "frame-ancestors $portfolio_frame_ancestors" always;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /sw.js =404;
    }

    location ~* ^/workbox-.*\.js$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.json {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /manifest.json =404;
    }

    # Cache hashed build assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Cache other static media. These are less deployment-critical than the
    # service worker and app shell.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # API proxy (optional - if you want to proxy through nginx)
    # location /api {
    #     proxy_pass ${API_URL};
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_cache_bypass $http_upgrade;
    # }

    # SPA fallback - serve index.html for all non-file routes
    location / {
        add_header Content-Security-Policy "frame-ancestors $portfolio_frame_ancestors" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
